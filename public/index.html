<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta http-equiv="Cache-control" content="no-store">
        <title>Quote of the day</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--Reference to css stylesheet-->
        <link rel="stylesheet" href="style.css">

        <!--Get the "Playfair" font from Google Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="content">
           
            <h4 id="time-to-next-quote-header">Next quote at midnight (UTC+1)</h4>
            <div class="quote-box">
                <blockquote id="quote-text">Debug text bla bla bla</blockquote>
            </div>
            <cite id="quote-author">- Debug Text</cite>
            <button id="random-quote-button">New random quote (debug button)</button>
            <button id="current-quote-button">Show current quote (debug button)</button>
        </div>

        <footer class="footer-single-line"><p>Made by <a class="footer-single-line-link" href="https://github.com/MKKrogsgaard">Marcus K. Krogsgaard</a></p></footer>

        <!--Get jQuery from googles CDN-->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <!--Reference to script defining jQuery functions-->
        <script src="scripts/jquery_functions.js"></script>

        <!--Reference to other JS code-->
        <script src="scripts/main.js"></script>
    </body>
</html>
